# Despliega la web en GitHub Pages (origen: GitHub Actions).
# Tras el primer push a main: Repo → Settings → Pages → Build: GitHub Actions.
# URL típica: https://<usuario>.github.io/<nombre-del-repo>/
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install & build
        # base = /nombre-repo/ para que carguen JS/CSS en GitHub Pages (proyecto).
        # Si tu repo es username.github.io, cambia la línea a: npm ci && npm run build -- --base /
        run: npm ci && npm run build -- --base /${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
