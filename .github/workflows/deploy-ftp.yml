# Compila la web y la sube por FTP al hosting de DonDominio en cada push a main.
#
# Configuración en GitHub → Settings → Environments → "FTP_SERVER":
#   Environment secrets (obligatorios): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables (opcionales, del environment o del repositorio):
#     FTP_SERVER_DIR  carpeta pública en el hosting (por defecto /public/)
#     FTP_PROTOCOL    ftps (por defecto) o ftp
name: Deploy DonDominio (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install & build
        run: npm ci && npm run build

      - name: Check FTP settings
        # Comprueba qué datos llegan con valor sin mostrar nunca su contenido.
        env:
          S_SERVER: ${{ secrets.FTP_SERVER }}
          S_USERNAME: ${{ secrets.FTP_USERNAME }}
          S_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          V_SERVER: ${{ vars.FTP_SERVER }}
          V_USERNAME: ${{ vars.FTP_USERNAME }}
          V_PASSWORD: ${{ vars.FTP_PASSWORD }}
        run: |
          missing=0
          summary=""
          for n in SERVER USERNAME PASSWORD; do
            s="S_$n"; v="V_$n"
            sv="${!s}"; vv="${!v}"
            trimmed="$(printf '%s' "$sv" | tr -d '[:space:]')"
            if [ -n "$trimmed" ]; then st="con valor"; elif [ -n "$sv" ]; then st="solo espacios"; missing=1; else st="vacío o no existe"; missing=1; fi
            [ -n "$vv" ] && vs="existe" || vs="no existe"
            echo "FTP_$n -> secret: $st | variable: $vs"
            summary="$summary FTP_$n=secret $st, variable $vs;"
          done
          echo "FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/public/ (por defecto)' }}"
          echo "FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps (por defecto)' }}"
          if [ "$missing" = 1 ]; then echo "::error::Falta algún secret FTP con valor:$summary"; exit 1; fi
          echo "::notice::Datos FTP correctos:$summary"

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./docs/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public/' }}
          # Archivos solo útiles para GitHub Pages.
          exclude: |
            **/.git*
            **/.git*/**
            CNAME
            .nojekyll
